<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Wizard’s Last Stand</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almendra:wght@400;700&display=swap">
<style>
:root{--bg:#120e1c;--stone:#2b2540;--stone2:#3a3354;--rune:#7be0d0;--gold:#e3b552;--blood:#d1465e;--xp:#b07cf0;--ink:#efe6d2;--dim:#a89cc0;
--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Almendra",Georgia,serif;overflow:hidden;overscroll-behavior:none}
#app{position:fixed;inset:0;overflow:hidden;touch-action:none}
canvas{position:absolute;left:0;top:0;image-rendering:pixelated;touch-action:none}
.bar{height:12px;background:#07050d;border:1px solid var(--stone2);border-radius:3px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;width:0}
.bar span{position:absolute;inset:0;font-size:10px;line-height:11px;text-align:center;text-shadow:0 0 3px #000}
#xpb{position:absolute;left:0;right:0;top:0;height:6px;border:0;border-radius:0;background:rgba(7,5,13,.8)}#xpb i{background:var(--xp)}
#tl{position:absolute;left:calc(10px + var(--sl));top:calc(12px + var(--st));width:190px;pointer-events:none}
#tl .lr{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--gold);font-size:16px}
#tl .bar{flex:1}#hp i{background:var(--blood)}
#qs{margin-top:6px;font-size:13px;line-height:1.35;text-shadow:0 1px 2px #000,0 0 4px #000}
#qs .d{color:var(--rune)}
#tm{position:absolute;left:50%;top:calc(8px + var(--st));transform:translateX(-50%);text-align:center;pointer-events:none;text-shadow:0 1px 3px #000,0 0 4px #000;white-space:nowrap}
#tmt{display:block;font-size:21px;font-weight:700}#tmt.gt{color:#ff7a5a}
#tmh{display:block;font-size:12px;color:var(--dim)}
#bb{display:none;margin:4px auto 0;width:220px;font-size:12px;color:var(--gold)}#bb .bar{height:8px;margin-top:2px}#bb i{background:#c83040}
#tr{position:absolute;right:calc(10px + var(--sr));top:calc(12px + var(--st));display:flex;gap:12px;align-items:center;font-weight:700;color:var(--gold);font-size:16px;text-shadow:0 1px 3px #000}
#pz{width:36px;height:36px;font-size:14px;opacity:.85}
#hb{position:absolute;left:50%;bottom:calc(8px + var(--sb));transform:translateX(-50%);display:flex;gap:6px;pointer-events:none;align-items:flex-end}
.sl{width:48px;height:48px;border:2px solid var(--stone2);border-radius:9px;background:rgba(20,15,32,.85);position:relative;display:flex;align-items:center;justify-content:center;font-size:25px;overflow:hidden}
.sl.em{border-style:dashed;opacity:.45}
.sl.rdy{border-color:var(--rune)}.sl.on{border-color:var(--xp)}
.sl .cv{position:absolute;inset:0}
.sl .tx{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;text-shadow:0 0 3px #000,0 0 3px #000;font-family:Georgia,serif}
.sl .lb{position:absolute;right:3px;bottom:0;font-size:11px;font-weight:700;font-style:normal;color:var(--gold);text-shadow:0 0 2px #000,0 0 2px #000}
.sl.pk{width:42px;height:42px;border-radius:50%;border-color:var(--gold);font-size:20px;margin-right:6px}
#msg{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:19px;color:var(--gold);text-shadow:0 1px 3px #000,0 0 6px #000;pointer-events:none;padding:0 20px}
#jr,#jk{position:absolute;border-radius:50%;display:none;pointer-events:none}
#jr{width:96px;height:96px;margin:-48px 0 0 -48px;border:2px solid rgba(123,224,208,.5);background:rgba(123,224,208,.08)}
#jk{width:40px;height:40px;margin:-20px 0 0 -20px;background:rgba(123,224,208,.55);border:2px solid var(--rune)}
#ov{position:absolute;inset:0;background:rgba(10,7,18,.95);display:flex;flex-direction:column;overflow-y:auto;padding:calc(14px + var(--st)) calc(18px + var(--sr)) calc(14px + var(--sb)) calc(18px + var(--sl));z-index:5;touch-action:pan-y}
#ov.hide{display:none}
.pn{margin:auto;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;width:100%;max-width:900px}
.pn h1{font-size:32px;margin:0;color:var(--gold);line-height:1.05}
.pn h2{font-size:17px;margin:4px 0 0;color:var(--dim);font-weight:400}
.pn p{margin:0;font-size:16px;line-height:1.4;max-width:50ch}
.gl{font-size:21px!important;color:var(--gold)}
button{font-family:inherit;color:var(--ink);background:var(--stone);border:2px solid var(--stone2);border-radius:10px;touch-action:manipulation;cursor:pointer}
button:active{background:var(--stone2)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:2px solid var(--rune);outline-offset:2px}
.go{background:var(--gold);color:#1a1226;border-color:var(--gold);font-weight:700;font-size:20px;padding:10px 24px;min-width:200px}
.sec{font-size:17px;padding:8px 20px;min-width:180px}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px;width:100%}
.cd{width:100%;display:grid;grid-template-columns:38px 1fr auto;gap:0 10px;text-align:left;padding:8px 11px;align-items:center;background:var(--stone);border:2px solid var(--stone2);border-radius:10px}
.cd>span{grid-row:1/3;font-size:26px;text-align:center}
.cd b{font-size:17px;color:var(--gold)}.cd em{font-style:normal;font-size:13px;color:var(--rune);margin-left:6px}
.cd small{font-size:14px;color:var(--ink);grid-column:2}
.cd .r{grid-row:1/3;grid-column:3;font-size:15px;color:var(--gold);white-space:nowrap}
.cd.done{border-color:var(--rune)}.cd.fail{opacity:.55}
.cd.nw{border-color:var(--rune);background:#1f3236}.cd.nw em{color:var(--rune)}
.cd[class*=rc]{border-color:var(--rc);background:linear-gradient(100deg,color-mix(in srgb,var(--rc) 18%,var(--stone)),var(--stone) 70%)}
.cd[class*=rc] em{color:var(--rc);font-weight:700}
.cd.rc0{border-color:var(--stone2)}
.cd.rc3{box-shadow:0 0 10px color-mix(in srgb,var(--rc) 50%,transparent)}
.cd.rc4{border-width:3px;box-shadow:0 0 16px var(--rc);animation:lg 1.6s ease-in-out infinite alternate}
@keyframes lg{to{box-shadow:0 0 6px var(--rc)}}
.lvg{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.lvg .cd{grid-template-columns:1fr;justify-items:center;text-align:center;padding:14px 10px;min-height:150px;align-content:center;gap:4px}
.lvg .cd>span{grid-row:auto;font-size:36px}.lvg .cd small{grid-column:auto}.lvg .cd em{display:block;margin:2px 0 0}
.two{display:grid;grid-template-columns:minmax(220px,.8fr) 1.4fr;gap:22px;align-items:center;width:100%}
.two>div{display:flex;flex-direction:column;align-items:center;gap:10px}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%}
.sb{padding:6px 2px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.15}
.sb span{font-size:22px}.sb.on{border-color:var(--gold);background:#3b2f22}.sb i{font-style:normal;color:var(--gold)}
.cls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.cl{padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:17px;font-weight:700}
.cl img{width:56px;height:56px;image-rendering:pixelated}
.cl small{font-size:12px;font-weight:400;color:var(--dim)}
.cl.on{border-color:var(--gold);background:#3b2f22}
.pkd{font-size:14px!important;color:var(--dim)}
.bms{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.bc{background:var(--stone);border:2px solid var(--stone2);border-radius:12px;padding:6px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;text-align:center}
.bc.on{border-color:var(--gold);background:#3b2f22}
.bc.lk{opacity:.5;cursor:default}
.bc img{width:100%;aspect-ratio:2/1;image-rendering:pixelated;border-radius:7px;display:block}
.bc b{font-size:16px;color:var(--gold)}.bc small{font-size:12px;color:var(--dim);line-height:1.25;min-height:30px}
.hzr{display:flex;gap:4px}
.hz{width:30px;height:30px;font-size:14px;font-weight:700;padding:0;position:relative}
.hz.cl{border-color:var(--rune);color:var(--rune)}
.hz.on{background:var(--gold);color:#1a1226;border-color:var(--gold)}
.hzd{font-size:15px!important;min-height:44px}
.path{display:flex;align-items:center;gap:6px;font-size:15px}
.path i{font-style:normal;width:34px;height:34px;border-radius:50%;border:2px solid var(--stone2);display:flex;align-items:center;justify-content:center;font-size:16px}
.path i.d{border-color:var(--rune);background:#1f3236}.path i.n{border-color:var(--gold)}
.path s{width:28px;height:2px;background:var(--stone2);text-decoration:none}
#rot{display:none;position:fixed;inset:0;z-index:20;background:var(--bg);flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px;font-size:20px}
#rot b{font-size:54px;display:inline-block;transform:rotate(90deg)}
.menu #tl,.menu #tm,.menu #tr,.menu #hb,.menu #xpb{display:none}
.pips{display:flex;gap:4px;margin-top:2px}.pips i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--hc)}.pips i.d{background:var(--hc)}
.dfr{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.df{padding:7px 14px;font-size:16px;border-color:color-mix(in srgb,var(--hc) 55%,var(--stone2));color:var(--hc)}
.df.on{background:var(--hc);color:#1a1226;border-color:var(--hc);font-weight:700}
.opts{display:grid;gap:14px;width:100%;max-width:480px}
.opts label{display:grid;grid-template-columns:160px 1fr 52px;align-items:center;gap:12px;text-align:left;font-size:17px}
.opts input{accent-color:var(--gold);width:100%;height:30px;cursor:pointer}
.opts b{color:var(--gold);text-align:right;font-family:Georgia,serif}
@media (max-height:430px){.intro{display:none}.bc small{display:none}}
@media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}
.two.sv{grid-template-columns:1fr 1fr;align-items:start}
.sv textarea{width:100%;height:64px;resize:none;padding:6px;font:11px/1.3 monospace;color:var(--ink);background:#07050d;border:2px solid var(--stone2);border-radius:8px;word-break:break-all;user-select:text;-webkit-user-select:text}
@media (max-width:640px){.two,.two.sv{grid-template-columns:1fr}.bms{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){.cd.rc4{animation:none}}
</style>
</head>
<body>
<div id="app" class="menu">
 <canvas id="c" aria-label="Cavern"></canvas>
 <div class="bar" id="xpb"><i></i></div>
 <div id="tl"><div class="lr"><span id="lv">Lv 1</span><div class="bar" id="hp"><i></i><span></span></div></div><div id="qs"></div></div>
 <div id="tm"><b id="tmt">0:00</b><small id="tmh"></small><div id="bb"><span id="bbn"></span><div class="bar"><i></i></div></div></div>
 <div id="tr"><span id="rrc" title="Level-up rerolls">🎲 0</span><span id="gd">🪙 0</span><span id="kl">☠ 0</span><button id="pz" aria-label="Pause">❚❚</button></div>
 <div id="hb"><div class="sl pk" id="pk"></div><div class="sl em"></div><div class="sl em"></div><div class="sl em"></div><div class="sl em"></div></div>
 <div id="msg" aria-live="polite"></div>
 <div id="jr"></div><div id="jk"></div>
 <div id="ov"></div>
</div>
<div id="rot"><b>📱</b>Turn your phone sideways to play.</div>
<script>
const $=id=>document.getElementById(id),R=n=>Math.random()*n,RI=n=>Math.floor(Math.random()*n),D=Math.hypot,PI=Math.PI;
const cv=$("c");let g=cv.getContext("2d");
let S=null,LW=320,LH=180,SR=200,E=[],PJ=[],AX=[],TR=[],PK=[],PT=[],TX=[],EF=[],EP=[],ZN=[],RG2=[],RC=new Map(),TH=new Map(),jx=0,jy=0,mt=0,last=0,fc=0,FLS=false,sh=0;const K={w:0,a:0,s:0,d:0};

/* ---------- save ---------- */
const SAVEK="wizards-last-stand-v1";
const SV0=()=>({gold:0,up:{},unl:{bolt:1,cleave:1,arrow:1},st:{wiz:"bolt",war:"cleave",rng:"arrow"},cls:"wiz",prog:{},dives:0,runs:0,sel:{b:0,h:0},vol:{m:.8,sfx:.8,mon:.7,amb:.6,ui:.7}});
let SV=SV0();
function loadSV(s){SV=SV0();if(s){for(const k in s){if(k=="unl"||k=="up"||k=="st"||k=="prog"||k=="sel"||k=="vol")Object.assign(SV[k],s[k]);else if(k!="start"&&k!="best")SV[k]=s[k]}if(s.start&&!s.st)SV.st.wiz=s.start}}
try{loadSV(JSON.parse(localStorage.getItem(SAVEK)))}catch(e){}
function save(){try{localStorage.setItem(SAVEK,JSON.stringify(SV))}catch(e){}}
const U=id=>SV.up[id]||0;

/* ---------- 16-bit sound ---------- */
const AU={c:null,v:0,last:{},amb:null,want:null,mt:1};
function crusher(c){const w=c.createWaveShaper(),n=2048,cu=new Float32Array(n);for(let i=0;i<n;i++){const x=i/(n-1)*2-1;cu[i]=Math.round(x*20)/20}w.curve=cu;return w}
function auInit(){if(AU.c)return AU.c;const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
 const c=new C(),m=c.createGain();m.connect(c.destination);AU.c=c;AU.m=m;AU.b={};AU.in={};
 for(const k of["sfx","mon","amb","ui"]){const gn=c.createGain();gn.connect(m);AU.b[k]=gn}
 for(const k of["sfx","mon"]){const i=c.createGain(),cr=crusher(c);i.connect(cr);cr.connect(AU.b[k]);AU.in[k]=i;
  const dl=c.createDelay(),fb=c.createGain(),wet=c.createGain();dl.delayTime.value=k=="sfx"?.15:.21;fb.gain.value=.3;wet.gain.value=.22;AU.b[k].connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(m)}
 const nb=c.createBuffer(1,c.sampleRate,c.sampleRate),d=nb.getChannelData(0);let h=0;for(let i=0;i<d.length;i++){if(i%3==0)h=Math.random()*2-1;d[i]=h}AU.nz=nb;
 applyVol();return c}
function applyVol(){if(!AU.c)return;const v=SV.vol;AU.m.gain.value=v.m*v.m;for(const k in AU.b)AU.b[k].gain.value=v[k]*v[k]*(k=="amb"?1.4:1)}
function auOK(){return AU.c&&AU.c.state=="running"}
function dest(bus,x){const c=AU.c,d=AU.in[bus]||AU.b[bus];if(x!=null&&S&&c.createStereoPanner){const p=c.createStereoPanner();p.pan.value=Math.max(-1,Math.min(1,(x-S.x)/(LW/2)))*.75;p.connect(d);return p}return d}
function tn(bus,o,x){const c=AU.c;if(!auOK()||AU.v>44)return;const t=c.currentTime+(o.dl||0),os=c.createOscillator(),gn=c.createGain();os.type=o.w||"square";os.frequency.setValueAtTime(o.f,t);if(o.f2)os.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2),t+o.d);
 if(o.vib){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=o.vib;lg.gain.value=o.f*.05;l.connect(lg);lg.connect(os.frequency);l.start(t);l.stop(t+o.d+.05)}
 gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(o.v||.2,t+(o.a||.004));gn.gain.exponentialRampToValueAtTime(.0008,t+o.d);os.connect(gn);gn.connect(dest(bus,x));os.start(t);os.stop(t+o.d+.03);AU.v++;os.onended=()=>AU.v--}
function nz(bus,o,x){const c=AU.c;if(!auOK()||AU.v>44)return;const t=c.currentTime+(o.dl||0),s=c.createBufferSource(),f=c.createBiquadFilter(),gn=c.createGain();s.buffer=AU.nz;s.loop=true;s.playbackRate.value=o.r||1;
 f.type=o.ft||"lowpass";f.frequency.setValueAtTime(o.f||2000,t);if(o.f2)f.frequency.exponentialRampToValueAtTime(o.f2,t+o.d);f.Q.value=o.q||1;
 gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(o.v||.2,t+(o.a||.003));gn.gain.exponentialRampToValueAtTime(.0008,t+o.d);s.connect(f);f.connect(gn);gn.connect(dest(bus,x));s.start(t,Math.random()*.5);s.stop(t+o.d+.03);AU.v++;s.onended=()=>AU.v--}
const arp=(bus,w,fs,d,v,st)=>fs.forEach((f,i)=>f&&tn(bus,{w,f,d,v,dl:i*st}));
const SFX={
 bolt:x=>{tn("sfx",{f:880,f2:220,d:.14,v:.11},x);nz("sfx",{f:3000,d:.06,v:.05},x)},
 nova:x=>{nz("sfx",{ft:"highpass",f:3000,d:.45,v:.1},x);[1568,1175,880,659].forEach((f,i)=>tn("sfx",{w:"triangle",f,d:.14,v:.13,dl:i*.05},x))},
 orb:x=>tn("sfx",{w:"triangle",f:1400+R(300),f2:900,d:.06,v:.07},x),
 chain:x=>{tn("sfx",{w:"sawtooth",f:2200,f2:300,d:.17,v:.09},x);nz("sfx",{ft:"bandpass",f:4000,q:2,d:.15,v:.14},x)},
 metcast:x=>tn("sfx",{w:"triangle",f:1500,f2:280,d:.65,v:.07},x),
 boom:x=>{nz("sfx",{f:1500,f2:70,d:.55,v:.34,r:.5},x);tn("sfx",{f:110,f2:32,d:.42,v:.17},x)},
 cleave:x=>{nz("sfx",{ft:"bandpass",f:500,f2:2600,q:1.5,d:.16,v:.22},x);tn("sfx",{f:180,f2:90,d:.08,v:.07},x)},
 whirl:x=>tn("sfx",{w:"triangle",f:950+R(200),f2:600,d:.05,v:.07},x),
 slam:x=>{tn("sfx",{f:100,f2:30,d:.42,v:.24},x);nz("sfx",{f:700,f2:60,d:.42,v:.3,r:.4},x)},
 axe:x=>nz("sfx",{ft:"bandpass",f:1100,f2:2600,q:3,d:.15,v:.14},x),
 cry:x=>{tn("sfx",{w:"sawtooth",f:220,f2:330,d:.55,v:.09,vib:9},x);tn("sfx",{f:277,f2:415,d:.55,v:.06,vib:7},x)},
 arrow:x=>{tn("sfx",{w:"triangle",f:820,f2:470,d:.09,v:.14},x);nz("sfx",{ft:"highpass",f:2500,d:.04,v:.07},x)},
 rain:x=>{for(let i=0;i<10;i++)nz("sfx",{ft:"highpass",f:2500+R(2000),d:.03,v:.06,dl:i*.1+R(.05)},x)},
 trap:x=>tn("sfx",{f:600,f2:200,d:.05,v:.07},x),
 snap:x=>{tn("sfx",{f:320,f2:90,d:.08,v:.15},x);nz("sfx",{ft:"highpass",f:3000,d:.05,v:.13},x)},
 hawk:x=>tn("sfx",{f:2000,f2:1300,d:.13,v:.06,vib:30},x),
 knife:x=>{for(let i=0;i<3;i++)tn("sfx",{w:"triangle",f:2600-i*300,f2:1900,d:.08,v:.07,dl:i*.025},x)},
 hit:x=>nz("sfx",{ft:"bandpass",f:1100+R(700),q:1,d:.04,v:.08},x),
 crit:x=>{tn("sfx",{f:1760,f2:2640,d:.06,v:.06},x);nz("sfx",{ft:"bandpass",f:2200,d:.05,v:.1},x)},
 gem:()=>tn("sfx",{w:"triangle",f:[1319,1568,1760,2093,2349][RI(5)],d:.06,v:.06}),
 coin:()=>{tn("sfx",{f:1319,d:.05,v:.05});tn("sfx",{f:1976,d:.12,v:.05,dl:.05})},
 mana:()=>arp("sfx","triangle",[523,659,784,1047],.12,.1,.04),
 star:()=>arp("sfx","square",[784,988,1175,1568,1976],.14,.06,.05),
 heal:()=>{arp("sfx","triangle",[392,523,659,784,1047],.2,.11,.06);nz("sfx",{ft:"highpass",f:3000,d:.4,v:.05,a:.1})},
 lvl:()=>arp("sfx","square",[523,659,784,1047,1319],.18,.08,.07),
 hurt:()=>{tn("sfx",{f:260,f2:90,d:.18,v:.15});nz("sfx",{f:1500,d:.1,v:.11})},
 block:()=>arp("sfx","triangle",[880,1320,1760],.15,.1,.03),
 dodge:()=>nz("sfx",{ft:"bandpass",f:800,f2:3200,q:2,d:.15,v:.12}),
 mine:x=>nz("sfx",{ft:"bandpass",f:900+R(800),q:4,d:.05,v:.11,r:.5},x),
